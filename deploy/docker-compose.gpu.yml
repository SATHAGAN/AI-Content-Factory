services:
  gpu-worker:
    build:
      context: ../gpu_worker
    container_name: acf-gpu-worker
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../models:/models
      - ../outputs:/outputs
    environment:
      VIDEO_MODEL_ID: Wan-AI/Wan2.1-T2V-1.3B
      VIDEO_MODEL_BACKEND: wan-cli
      WAN_REPO: /opt/Wan2.1
      WAN_CKPT: /models/Wan2.1-T2V-1.3B
      GENERATION_TIMEOUT_SECONDS: 1800
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
