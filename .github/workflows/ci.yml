name: CI

on:
  push:
    branches: [main, production-e2e-integration]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q app gpu_worker
      - name: Run tests
        run: pytest
