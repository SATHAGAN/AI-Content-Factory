[project]
name = "ai-content-factory"
version = "0.1.0"
description = "Multi-tenant foundation for an AI content automation platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "google-cloud-storage>=3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
